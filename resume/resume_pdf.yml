name: Build resume PDF

on:
  push:
    paths:
      - "resume/**"
      - "!resume/**/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install --no-save puppeteer

      - name: Generate PDF from resume/res.html
        run: |
          node - <<'JS'
          const puppeteer = require('puppeteer');
          const path = require('path');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.goto('file://' + path.resolve('resume/res.html'), { waitUntil: 'networkidle0' });
            await page.pdf({
              path: 'resume/Sujal-Kurkute-Resume.pdf',
              format: 'A4',
              printBackground: true,
              preferCSSPageSize: true
            });
            await browser.close();
          })();
          JS

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume/Sujal-Kurkute-Resume.pdf
          git diff --cached --quiet || (git commit -m "Update resume PDF" && git push)